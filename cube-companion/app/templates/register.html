{% extends "base.html" %}
{% block title %}Register - Cube Companion{% endblock %}

{% block content %}
<div class="form-container">
    <h2 class="form-title">Create Account</h2>
    <p class="form-subtitle">Join Cube Companion today</p>
    <form method="POST" class="auth-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="Choose a username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Choose a password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Create Account</button>
    </form>
    <p class="form-footer">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
</div>
{% endblock %}
